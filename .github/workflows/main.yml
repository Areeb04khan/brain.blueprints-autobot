name: Daily Shayari Post

on:
  schedule:
    - cron: '30 2 * * *'  # 2:30 AM UTC = 8:00 AM IST — Photo
    - cron: '30 13 * * *' # 1:30 PM UTC = 7:00 PM IST — Reel
  workflow_dispatch:
    inputs:
      post_type:
        description: 'Post type: photo or reel'
        required: true
        default: 'photo'

jobs:
  post-shayari:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core fonts-noto-extra ffmpeg
          fc-cache -f -v

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore progress
        uses: actions/cache@v4
        with:
          path: progress.json
          key: progress-${{ github.run_number }}
          restore-keys: |
            progress-

      - name: Determine post type
        id: post_type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.post_type }}" >> $GITHUB_OUTPUT
          elif [ "$(date -u +%H)" -le "04" ]; then
            echo "type=photo" >> $GITHUB_OUTPUT
          else
            echo "type=reel" >> $GITHUB_OUTPUT
          fi

      - name: Run Shayari Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          POST_TYPE: ${{ steps.post_type.outputs.type }}
        run: python poster.py

      - name: Save progress
        uses: actions/cache/save@v4
        if: always()
        with:
          path: progress.json
          key: progress-${{ github.run_number }}
