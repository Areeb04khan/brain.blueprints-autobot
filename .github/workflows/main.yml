        # default: 'photo'

# jobs:
 # post-shayari:
    # runs-on: ubuntu-latest

    # steps:
      - name: Checkout code
        # uses: actions/checkout@v4

      - name: Set up Python
       # uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        # run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core fonts-noto-extra ffmpeg
          fc-cache -f -v

      - name: Install Python dependencies
       # run: pip install -r requirements.txt

      - name: Configure git
       # run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - name: Determine post type
        id: post_type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger — use whatever the user selected
            echo "type=${{ github.event.inputs.post_type }}" >> $GITHUB_OUTPUT

          else
            # Scheduled trigger — detect by UTC hour
            # FIX: was comparing string "02" with -le, which always evaluated oddly.
            # Now using integer arithmetic: hour 0-4 UTC = 5:30-9:30 AM IST = photo window
            HOUR=$(date -u +%H | sed 's/^0*//')  # Strip leading zero so bash treats as integer
            HOUR=${HOUR:-0}                        # Default to 0 if empty (midnight edge case)

            if [ "$HOUR" -le 4 ]; then
              echo "type=photo" >> $GITHUB_OUTPUT  # 2:30 AM UTC trigger lands here
            else
              echo "type=reel" >> $GITHUB_OUTPUT   # 1:30 PM UTC trigger lands here
            fi
          fi

      - name: Run Shayari Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          POST_TYPE: ${{ steps.post_type.outputs.type }}
        run: python poster.py

      - name: Save progress to repo
        if: always()
        run: |
          # Pull latest first to avoid push conflicts
          git pull origin master
          git add progress.json
          # Only commit if progress.json actually changed (--quiet exits 0 if no diff)
          git diff --staged --quiet || git commit -m "Update progress [skip ci]"
          git push
