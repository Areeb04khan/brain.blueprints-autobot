name: Brain Blueprints Reel Automation

on:
  schedule:
    - cron: '0 7,14,22 * * *'  # Runs 3 times a day
  workflow_dispatch:

jobs:
  post-reel:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # <-- ADDED: required for the new commit step below
    # Bumped 25 -> 30. poster.py now retries every external call (AI, TTS,
    # media upload, Instagram) instead of failing on the first hiccup, which
    # adds a bit of worst-case runtime. This is a ceiling, not a target --
    # it costs nothing unless a run actually needs it. A normal successful
    # run still finishes in 2-5 minutes, same as before.
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core fonts-dejavu-extra ffmpeg
          fc-cache -f -v

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y google-generativeai
          pip install \
            google-genai==2.16.0 \
            requests==2.34.2 \
            pillow==12.3.0 \
            moviepy==1.0.3 \
            numpy==2.4.6 \
            elevenlabs==2.60.0 \
            edge-tts==7.2.8 \
            openai==2.52.0

      - name: Run Bot Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          MEDIA_HOST: tempfile
        run: python -u poster.py

      # ---- NEW STEP: commits rotation_state.json back to the repo -------
      # Without this, the grid-column rotation resets to Column 1 every
      # single run and never actually cycles through 2 and 3. See the
      # explanation at the top of this file for why this is required.
      - name: Commit updated rotation state
        if: success()   # only commit if poster.py actually succeeded --
                         # matches poster.py's own "don't advance rotation
                         # on failure" logic in run()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rotation_state.json
          git diff --staged --quiet && echo "No rotation change to commit" || git commit -m "chore: advance grid-column rotation [skip ci]"
          git push
