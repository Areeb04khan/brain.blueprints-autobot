name: Instagram Token Renewal Reminder

on:
  schedule:
    - cron: '0 9 * * *'  # Runs daily at 9 AM UTC to check
  workflow_dispatch:      # Manual trigger to test

jobs:
  check-and-remind:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if reminder is due
        id: check
        run: |
          # Read last reminder date
          if [ -f ".token_reminder_date" ]; then
            LAST=$(cat .token_reminder_date)
          else
            LAST="2000-01-01"
          fi

          TODAY=$(date +%Y-%m-%d)
          LAST_TS=$(date -d "$LAST" +%s)
          TODAY_TS=$(date -d "$TODAY" +%s)
          DIFF=$(( (TODAY_TS - LAST_TS) / 86400 ))

          echo "Days since last reminder: $DIFF"
          echo "days=$DIFF" >> $GITHUB_OUTPUT

      - name: Create reminder issue
        if: steps.check.outputs.days >= 55
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔑 Instagram Access Token Renewal Due!',
              body: `## Token Renewal Reminder\n\nYour Instagram Access Token expires every 60 days.\n\n### Steps to renew:\n1. Go to your friend's Meta Developer account\n2. Open the **ShayariBot** app\n3. Go to **Use cases → Instagram API → API setup with Instagram login**\n4. Click **Generate token** next to ak_apak\n5. Copy the new token\n6. Go to your GitHub repo → **Settings → Secrets → Actions**\n7. Update **INSTAGRAM_ACCESS_TOKEN** with the new token\n8. Close this issue once done ✅\n\n> Reminder generated automatically — do this within the next 5 days to avoid interruption.`,
              labels: ['reminder']
            });

      - name: Update reminder date
        if: steps.check.outputs.days >= 55
        run: |
          echo $(date +%Y-%m-%d) > .token_reminder_date
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .token_reminder_date
          git commit -m "Update token reminder date"
          git push
