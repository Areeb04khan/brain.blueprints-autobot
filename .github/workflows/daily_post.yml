name: Daily Shayari Post

on:
  schedule:
    - cron: '0 3 * * *'  # 3:00 AM UTC = 8:30 AM IST daily
  workflow_dispatch:      # Allows manual trigger from GitHub dashboard

jobs:
  post-shayari:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore progress file
        uses: actions/cache@v4
        with:
          path: progress.json
          key: progress-${{ github.run_number }}
          restore-keys: |
            progress-

      - name: Run Shayari Bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: python poster.py --run-once

      - name: Save progress file
        uses: actions/cache/save@v4
        if: always()
        with:
          path: progress.json
          key: progress-${{ github.run_number }}
